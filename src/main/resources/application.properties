# Application Configuration
spring.application.name=Chamaa API
app.name=Chamaa API
app.version=1.0.0
app.description=Community-based lending platform

# Server Configuration
server.port=8080
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-binding-errors=always

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/chamaa_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# Logging
logging.level.root=INFO
logging.level.com.chamaa=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# Blockchain Configuration
blockchain.polygon.rpc-url=https://polygon-rpc.com
blockchain.polygon.chain-id=137
