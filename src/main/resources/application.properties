# Application Configuration
spring.application.name=Chamaa API
app.name=Chamaa API
app.version=1.0.0
app.description=Community-based lending platform

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-binding-errors=always

# Database Configuration - H2 (Development Default)
# For production PostgreSQL, use: spring.profiles.active=prod
spring.datasource.url=${DB_URL:jdbc:h2:mem:chamaadb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration - H2 Dialect
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Logging
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.chamaa=${LOG_LEVEL_CHAMAA:DEBUG}
logging.level.org.springframework.web=${LOG_LEVEL_SPRING_WEB:INFO}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:WARN}

# Blockchain Configuration
blockchain.polygon.rpc-url=${POLYGON_RPC_URL:https://polygon-rpc.com}
blockchain.polygon.chain-id=${POLYGON_CHAIN_ID:137}

